<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna · robomantri</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 2rem;
  }
  main {
    max-width: 640px;
    width: 100%;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
  }
  .tagline {
    color: var(--muted);
    font-size: 1.1rem;
    margin: 0 0 2rem;
  }
  p {
    line-height: 1.6;
    color: var(--fg);
  }
  a {
    color: var(--accent);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
  .links {
    margin-top: 2rem;
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  footer {
    margin-top: 3rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>Krishna</h1>
  <p class="tagline">Robotics engineer · humanoid autonomy</p>
  <p>
    Building navigation and learning stacks for the Unitree G1 humanoid —
    SLAM, planning, and VLA-style policies.
  </p>
  <div class="links">
    <a href="https://github.com/robomantri">GitHub</a>
  </div>
  <footer>
    Hosted on GitHub Pages.
  </footer>
</main>
</body>
</html>
